<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F7F4ED" />
  <meta name="description" content="MELO. 迷錄隨機和弦練習器，自選和弦、跟著節拍練轉換，讓每天的吉他練習有一點不一樣。" />
  <title>隨機和弦練習器 — MELO. 迷錄音樂工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="images/melo-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header focus-hide">
    <a class="brand" href="../index.html" aria-label="MELO. 迷錄音樂工具箱首頁">
      <span class="brand-mark">MELO.</span><span class="brand-name">迷錄音樂工具箱</span>
    </a>
    <img class="brand-art" src="images/milk-frog.png" alt="" width="72" height="64" />
  </header>
  <main class="page">
    <div class="mode-bar focus-hide">
      <h1 class="mode-heading">
        <label class="sr-only" for="practiceMode">選擇練習模式</label>
        <select id="practiceMode" onchange="switchPracticeMode()">
          <option value="seconds">秒數反應練習器</option>
          <option value="practice" selected>無限和弦練習器</option>
          <option value="progression">隨機和弦練習器</option>
        </select>
      </h1>
    </div>
    <div class="workspace">
      <section id="practiceStage" class="card practice-stage" aria-label="和弦練習區">
        <div class="stage-top">
          <span id="stageMode">BPM 無限練習</span>
          <button id="focusPractice" class="quiet-btn" type="button" aria-pressed="false" onclick="toggleFocusMode()">專注練習</button>
        </div>
        <p class="sr-only" id="currentLabel">目前和弦</p>
        <strong class="practice-chord" id="currentChord" aria-labelledby="currentLabel">—</strong>
        <div class="next-chord-row" id="nextChordPreview"><span>下一個</span><strong id="nextChord">—</strong></div>
        <div class="result" id="result" role="status" hidden>尚未產生</div>
        <div class="progress-area" id="progressArea">
          <div class="beat-track" id="beatTrack" aria-hidden="true"></div>
          <div class="beat-display" id="practiceBeat">尚未開始</div>
          <progress id="countdownProgress" max="1" value="1" aria-label="倒數進度" hidden></progress>
          <div class="timer-box" id="timerDisplay" hidden>尚未開始</div>
        </div>
        <div class="focus-speed-controls" id="focusSpeedControls"></div>
        <div class="button-group practice-controls">
          <button id="startPractice" onclick="startPractice()">開始練習</button>
          <button id="pausePractice" class="secondary-btn" onclick="togglePause()" disabled>暫停</button>
          <button id="stopPractice" class="secondary-btn" onclick="stopPractice()" disabled>停止</button>
        </div>
        <p class="status-text" id="practiceStatus" role="status">尚未開始</p>
        <div class="practice-metrics"><span id="practiceTime">已練習 0:00</span></div>
        <p class="hint" id="progressionRules" hidden>不重複抽取和弦，隨機排列。</p>
      </section>
      <aside class="settings-column focus-hide" aria-label="練習設定、和弦管理與進階設定">
        <details class="card basic-settings" id="basicSettings">
          <summary>練習設定</summary>
          <div class="details-content">
            <div class="quick-settings" id="quickSettings">
        <div id="progressionSettings" class="progression-settings" hidden>
          <div class="count-setting"><label for="count">抽幾個和弦</label><input id="count" type="number" min="1" value="4" inputmode="numeric" /></div>
          <div class="checkbox-row"><input id="enableTimer" type="checkbox" onchange="updatePracticeOptions()" /><label for="enableTimer">使用倒數計時器</label></div>
        </div>
        <div class="speed-control" id="secondsControls" hidden>
          <button id="secondsMinus" class="secondary-btn" onclick="adjustSeconds(-1)" aria-label="減少 1 秒">−1</button>
          <div class="speed-input"><label class="sr-only" id="timerSecondsLabel" for="timerSeconds">每個和弦秒數</label><input id="timerSeconds" type="number" min="1" value="30" step="1" onchange="changeSeconds()" inputmode="numeric" /><span>秒</span></div>
          <button id="secondsPlus" class="secondary-btn" onclick="adjustSeconds(1)" aria-label="增加 1 秒">+1</button>
        </div>
        <div class="speed-control" id="bpmControls">
          <button id="bpmMinus" class="secondary-btn" onclick="adjustBpm(-5)" aria-label="減少 5 BPM">−5</button>
          <div class="speed-input"><label class="sr-only" for="practiceBpm">速度 BPM，30 至 240</label><input id="practiceBpm" type="number" min="30" max="240" value="80" step="1" onchange="changeBpm()" inputmode="numeric" /><span>BPM</span></div>
          <button id="bpmPlus" class="secondary-btn" onclick="adjustBpm(5)" aria-label="增加 5 BPM">+5</button>
        </div>
        <p class="speed-hint" id="speedHint" role="status"></p>
            </div>

            <div id="sessionSettings">
              <label for="practiceDuration">練習時間</label>
              <select id="practiceDuration"><option value="0">不限時</option><option value="60">1 分鐘</option><option value="180">3 分鐘</option></select>
            </div>
            <div id="beatSettings">
              <label for="beatsPerChord">幾拍換和弦</label>
              <select id="beatsPerChord" onchange="renderBeatTrack()"><option value="2">2 拍</option><option value="3">3 拍</option><option value="4" selected>4 拍</option></select>
            </div>
          </div>
        </details>

        <details class="card input-card" id="chordSettings">
          <summary>和弦管理</summary>
          <div class="details-content">
            <label class="sr-only" for="chords">和弦輸入</label>
            <textarea id="chords" rows="2" placeholder="C Am F G" aria-describedby="chordHint">C Am F G</textarea>
            <p class="hint" id="chordHint">空格、逗號或換行分隔。</p>
            <div class="button-group">
              <button class="secondary-btn" onclick="saveFavoriteChords()">儲存常用</button>
              <button class="secondary-btn" onclick="loadFavoriteChords()">載入常用</button>
              <button class="text-btn" onclick="clearFavoriteChords()">清除常用</button>
            </div>
            <p class="hint" id="favoriteChordsStatus" role="status"></p>
            <div class="saved-section"><h2>已儲存和弦</h2><div class="saved-box" id="savedChordsDisplay">尚未儲存</div></div>
          </div>
        </details>
        <details class="card advanced" id="advancedSettings">
          <summary>進階設定<span class="acceleration-badge" id="accelerationBadge">加速關閉</span></summary>
          <div class="details-content">
            <div id="bpmSettings">
              <div class="checkbox-row"><input id="enableAcceleration" type="checkbox" onchange="updatePracticeOptions()" /><label for="enableAcceleration">漸進加速</label></div>
              <div id="accelerationSettings" hidden>
                <label for="accelerationSeconds">每幾秒增加 1 BPM</label><select id="accelerationSeconds"><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select>
                <label for="maxPracticeBpm">最高 BPM</label><input id="maxPracticeBpm" type="number" min="30" max="240" value="120" />
              </div>
              <div class="checkbox-row"><input id="practiceSound" type="checkbox" checked /><label for="practiceSound">節拍聲（首拍加重音）</label></div>
            </div>
          </div>
        </details>
      </aside>
    </div>
    <footer class="site-footer focus-hide">MELO. · 迷錄音樂工作室</footer>
  </main>
  <script src="js/settings.js"></script>
  <script src="js/practice-clock.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/interface.js"></script>
</body>
</html>
