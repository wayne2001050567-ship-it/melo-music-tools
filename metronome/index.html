<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F7F4ED" />
  <title>節拍器 — MELO. 迷錄音樂工具箱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="../chord-randomizer/images/melo-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="../chord-randomizer/css/tokens.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <header><a class="brand" href="../index.html" aria-label="MELO. 迷錄音樂工具箱首頁">MELO.</a><span>迷錄音樂工具箱</span></header>
  <main>
    <h1>節拍器</h1>
    <section class="metronome" aria-label="節拍器控制">
      <label for="bpm">速度</label>
      <div class="tempo">
        <button id="slower" type="button" aria-label="減少 5 BPM">−5</button>
        <div class="bpm-field"><input id="bpm" type="number" min="30" max="240" step="1" value="80" inputmode="numeric" aria-label="BPM" /><span>BPM</span></div>
        <button id="faster" type="button" aria-label="增加 5 BPM">+5</button>
      </div>
      <div id="beatLights" class="beats" aria-hidden="true"></div>
      <p id="beatText" class="beat-text">第 0 / 4 拍</p>
      <div class="meter"><label for="meter">每小節拍數</label><select id="meter"><option value="2">2 拍</option><option value="3">3 拍</option><option value="4" selected>4 拍</option></select></div>
      <p class="hint">第一拍重音</p>
      <div class="actions"><button id="start" type="button">開始</button><button id="stop" type="button" disabled>停止</button></div>
      <p id="status" role="status">尚未開始</p>
    </section>
  </main>
  <footer>MELO. · Melo Music Studio</footer>
</body>
</html>
