<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隨機簡譜產生器 — MELO. 迷錄音樂工具箱</title>
<link rel="icon" href="../chord-randomizer/images/melo-mark.svg" type="image/svg+xml">
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: #f7f4ee; color: #403b36; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; }
.container { max-width: 1200px; margin: auto; padding: 0 20px 24px; }
header { display: flex; align-items: center; gap: 20px; padding: 10px 0; border-bottom: 1px solid #ded8cf; margin-bottom: 16px; }
.brand { display: inline-flex; align-items: center; min-height: 44px; flex-shrink: 0; font: 800 32px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing: -.07em; color: inherit; text-decoration: none; }
h1 { font-size: 23px; margin: 0; font-weight: 600; }
h2 { font-size: 17px; margin: 0; }
.card { min-width: 0; background: #fffdf9; border: 1px solid #ded8cf; border-radius: 18px; padding: 18px; margin-bottom: 14px; }
.controls { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)) minmax(180px,1.2fr); gap: 12px; align-items: end; }
.setting { min-width: 0; }
.setting label { display: block; font-size: 14px; margin-bottom: 5px; }
select { width: 100%; min-width: 0; min-height: 46px; border: 1px solid #d5cec5; border-radius: 9px; background: #fffdf9; color: inherit; padding: 8px; font: inherit; }
button { min-height: 44px; border: 1px solid transparent; border-radius: 9px; padding: 9px 14px; cursor: pointer; font: inherit; color: inherit; touch-action: manipulation; }
.primary-button { background: #8d6b59; color: white; font-weight: 600; min-height: 46px; }
.primary-button:hover { background: #795b4c; }
.small-button { background: #eee8df; font-size: 14px; }
:focus-visible { outline: 3px solid #8d6b59; outline-offset: 3px; }
#error { color: #a34f45; font-size: 14px; margin: 8px 0 0; }
#error:empty { display: none; }
.score-info { font-size: 14px; color: #817970; margin: 4px 0 12px; }
.score { display: grid; gap: 12px; min-width: 0; }
.score-line { width: 100%; min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; padding: 4px 0 8px; }
.score-line-inner { display: flex; width: 100%; min-width: var(--line-min); }
/* Every measure and every beat uses the same grid width within a question. */
.bar { flex: 0 0 calc(var(--bar-width) * 1px); width: calc(var(--bar-width) * 1px); display: grid; grid-template-columns: repeat(var(--beats), minmax(0, 1fr)); align-items: start; gap: var(--beat-gap, 18px); padding: 8px var(--bar-pad, 12px); border-right: 2px solid #514a44; }
.bar:first-child { border-left: 2px solid #514a44; }
.beat-slot { display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
.beat-group { display: flex; flex: 0 0 auto; gap: var(--note-gap, 3px); position: relative; padding-bottom: 8px; }
.rhythm-beam { position: absolute; height: 2px; background: currentColor; bottom: 10px; pointer-events: none; }
.rhythm-beam.secondary { bottom: 5px; }
.rhythm-item { display: flex; align-items: center; flex: 0 0 auto; gap: 8px; }
.note { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: var(--note-cell, 24px); height: 48px; font: 600 var(--note-font, 30px)/1 Arial, sans-serif; }
.note.has-accidental { width: calc(var(--note-cell, 24px) + var(--accidental-space, 12px)); padding-left: var(--accidental-space, 12px); }
.digit { position: relative; display: inline-flex; align-items: center; justify-content: center; width: var(--digit-width, 18px); height: 48px; }
.note.high .digit::before, .note.low .digit::after { content: "•"; position: absolute; left: 50%; transform: translateX(-50%); font-size: 13px; line-height: 1; }
.note.high .digit::before { top: -1px; }
.note.low .digit::after { bottom: -1px; }
.beat-group.has-low { padding-bottom: 17px; }
.accidental { position: absolute; left: 0; top: 5px; width: var(--accidental-space, 12px); text-align: center; font: 400 var(--accidental-font, 15px)/1 Arial, sans-serif; }
.duration-dash { display: inline-flex; align-items: center; justify-content: center; width: var(--note-cell, 24px); height: 48px; font-size: var(--note-font, 28px); }
summary { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; min-height: 44px; cursor: pointer; list-style: none; font-weight: 600; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "展開 ＋"; margin-left: auto; font-size: 14px; color: #817970; font-weight: 400; }
details[open] > summary::after { content: "收合 −"; }
.selection-summary { min-width: 0; overflow-wrap: anywhere; font-size: 14px; color: #817970; font-weight: 400; }
.selection-content { padding-top: 12px; }
.selection-actions, .tabs, .note-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.selection-actions { margin-bottom: 12px; }
.tabs { border-bottom: 1px solid #ded8cf; padding-bottom: 8px; margin-bottom: 12px; }
.tabs button { flex: 1; background: transparent; border-color: #ded8cf; }
.tabs button[aria-selected="true"] { background: #eee8df; border-color: #8d6b59; }
.note-option { position: relative; }
.note-option input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.note-option label { display: flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; border: 1px solid #d8d1c7; border-radius: 9px; padding: 7px 10px; cursor: pointer; font-size: 17px; font-weight: 600; }
.note-option input:checked + label { background: #8d6b59; color: white; border-color: #8d6b59; }
.note-option input:focus-visible + label { outline: 3px solid #8d6b59; outline-offset: 3px; }
.accidental-settings { margin-top: 12px; }
.accidental-settings summary { font-size: 14px; font-weight: 400; }
.accidental-settings .note-grid { padding-top: 8px; }
.octave-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
@media (max-width: 599px) {
 .container { padding: 0 12px 16px; }
 header { gap: 14px; padding: 6px 0; margin-bottom: 10px; }
 .brand { font-size: 28px; }
 h1 { font-size: 19px; }
 .card { padding: 12px; margin-bottom: 10px; }
 .controls { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 8px; }
 .primary-button { grid-column: 1 / -1; }
 select { font-size: 14px; padding-inline: 4px; }
 .selection-summary { flex-basis: 100%; order: 3; }
}
@media (max-height: 500px) and (orientation: landscape) {
 header { padding-block: 2px; margin-bottom: 8px; }
 h1 { font-size: 19px; }
 .card { padding: 10px 12px; margin-bottom: 8px; }
 .controls { gap: 8px; }
}
</style>
</head>
<body>
<div class="container">
<header><a class="brand" href="../index.html" aria-label="MELO. 迷錄音樂工具箱首頁">MELO.</a><h1>隨機簡譜產生器</h1></header>
<main>
<section class="card" aria-label="練習操作">
 <div class="controls">
  <div class="setting"><label for="minDuration">最短音符</label><select id="minDuration"><option value="1">四分音符</option><option value="0.5">八分音符</option><option value="0.25">十六分音符</option></select></div>
  <div class="setting"><label for="meter">拍號</label><select id="meter"><option value="4">4 / 4</option><option value="3">3 / 4</option><option value="2">2 / 4</option></select></div>
  <div class="setting"><label for="bars">小節數</label><select id="bars"><option value="1">1 小節</option><option value="2">2 小節</option><option value="4" selected>4 小節</option><option value="8">8 小節</option><option value="12">12 小節</option><option value="16">16 小節</option></select></div>
  <button id="generate" class="primary-button" type="button">產生新題目</button>
 </div>
 <p id="error" role="status"></p>
</section>
<section class="card score-card" aria-labelledby="scoreTitle"><h2 id="scoreTitle">視譜練習</h2><div id="scoreInfo" class="score-info" role="status"></div><div id="score" class="score"></div></section>
<details class="card" id="pitchSettings"><summary><span>出題音設定</span><span id="selectionSummary" class="selection-summary">中音 1–7・共 7 個音</span></summary><div class="selection-content">
 <div class="selection-actions"><button id="naturalAll" class="small-button" type="button">全部自然音</button><button id="clearAll" class="small-button" type="button">全部清除</button></div>
 <div class="tabs" role="tablist" aria-label="出題音域"></div><div id="noteSelector"></div>
</div></details>
</main>
</div>
<script>
const octaveGroups = [{name:'低音',value:'low'},{name:'中音',value:'middle'},{name:'高音',value:'high'}];
const accidentals = [{name:'♭',value:'flat'},{name:'',value:'natural'},{name:'♯',value:'sharp'}];
const noteSelector = document.getElementById('noteSelector');
const score = document.getElementById('score');
let currentBars = [];
let activeOctave = 'middle';
function selectOctave(value) {
 activeOctave = value;
 document.querySelectorAll('[role="tab"]').forEach(tab => { const active=tab.dataset.octave===value; tab.setAttribute('aria-selected',active); tab.tabIndex=active?0:-1; });
 document.querySelectorAll('.octave-section').forEach(panel => panel.hidden=panel.dataset.octave!==value);
}
octaveGroups.forEach((octave, oi) => {
 const tab=document.createElement('button'); tab.type='button'; tab.textContent=octave.name; tab.dataset.octave=octave.value; tab.id='tab-'+octave.value; tab.setAttribute('role','tab'); tab.setAttribute('aria-controls','panel-'+octave.value);
 tab.addEventListener('click',()=>selectOctave(octave.value));
 tab.addEventListener('keydown',event=>{ const direction=event.key==='ArrowRight'?1:event.key==='ArrowLeft'?-1:0; if(direction || event.key==='Home' || event.key==='End'){event.preventDefault();const index=event.key==='Home'?0:event.key==='End'?2:(oi+direction+3)%3;selectOctave(octaveGroups[index].value);document.getElementById('tab-'+activeOctave).focus();}});
 document.querySelector('.tabs').appendChild(tab);
 const section=document.createElement('div'); section.className='octave-section'; section.dataset.octave=octave.value; section.id='panel-'+octave.value; section.setAttribute('role','tabpanel'); section.setAttribute('aria-labelledby',tab.id);
 const natural=document.createElement('div'); natural.className='note-grid';
 const extra=document.createElement('details'); extra.className='accidental-settings'; extra.innerHTML='<summary>顯示升降音</summary><div class="note-grid"></div>';
 for(let number=1;number<=7;number++) accidentals.forEach((accidental,ai)=>{
  if((number===1&&ai===0)||(number===3&&ai===2)||(number===4&&ai===0)||(number===7&&ai===2))return;
  const wrapper=document.createElement('div');wrapper.className='note-option'; const id=`note-${oi}-${number}-${ai}`;
  wrapper.innerHTML=`<input type="checkbox" id="${id}" data-number="${number}" data-octave="${octave.value}" data-accidental="${accidental.value}" ${octave.value==='middle'&&ai===1?'checked':''}><label for="${id}" aria-label="${octave.name} ${accidental.name}${number}">${accidental.name}${number}</label>`;
  (ai===1?natural:extra.querySelector('.note-grid')).appendChild(wrapper);
 });
 section.append(natural,extra);
 const actions=document.createElement('div');actions.className='octave-actions';
 const naturalButton=document.createElement('button');naturalButton.type='button';naturalButton.className='small-button';naturalButton.textContent='此音域選自然音';naturalButton.addEventListener('click',()=>{getAllInputs().filter(i=>i.dataset.octave===octave.value).forEach(i=>i.checked=i.dataset.accidental==='natural');updateSelection();});actions.appendChild(naturalButton);section.appendChild(actions);noteSelector.appendChild(section);
});
function getAllInputs(){return Array.from(noteSelector.querySelectorAll('input'));}
function getSelectedNotes(){return getAllInputs().filter(i=>i.checked).map(i=>({number:i.dataset.number,octave:i.dataset.octave,accidental:i.dataset.accidental}));}
function updateSelection(){
 const selected=getSelectedNotes();
 const parts=octaveGroups.map(o=>{const notes=selected.filter(n=>n.octave===o.value);if(!notes.length)return ''; const allNatural=notes.length===7&&notes.every(n=>n.accidental==='natural');return o.name+' '+(allNatural?'1–7':notes.map(n=>(n.accidental==='flat'?'♭':n.accidental==='sharp'?'♯':'')+n.number).join('、'));}).filter(Boolean);
 document.getElementById('selectionSummary').textContent=(parts.join('／')||'尚未選音')+'・共 '+selected.length+' 個音';
 document.getElementById('error').textContent=selected.length?'':'請至少選擇一個出題音';
}
function randomItem(array) {

    return array[
        Math.floor(
            Math.random()
            *
            array.length
        )
    ];

}


/* =========================================
   可使用的音符時值
========================================= */

// Patterns start on quarter-note beat boundaries in the supported /4 meters.
const sixteenthPatterns = [
    [0.25, 0.25, 0.25, 0.25],
    [0.5, 0.25, 0.25],
    [0.25, 0.25, 0.5],
    [0.25, 0.5, 0.25]
];
function generateRhythmForBar(beats, minDuration, requireSixteenth = false) {
    const rhythm = [];
    const denseLimit = Math.min(2, beats);
    let remaining = beats;
    let denseBeats = 0;
    while (remaining > 0) {
        const patterns = [[1]];
        if (minDuration <= 0.5) patterns.push([0.5, 0.5]);
        if (remaining >= 2) patterns.push([2]);
        if (minDuration <= 0.25 && denseBeats < denseLimit) {
            patterns.push(...sixteenthPatterns);
        }
        // Reserve the last beat when this question still needs a sixteenth group.
        const candidates = requireSixteenth && denseBeats === 0
            ? patterns.filter(pattern => pattern.includes(0.25) || pattern.reduce((a,b) => a+b, 0) < remaining)
            : patterns;
        const pattern = randomItem(candidates);
        rhythm.push(...pattern);
        if (pattern.includes(0.25)) denseBeats++;
        remaining -= pattern.reduce((a,b) => a+b, 0);
    }
    return rhythm;
}

// Work in integer sixteenth-note ticks; mixed durations must never cross a beat group.
function groupEvents(events) {
    const groups = [];
    let position = 0;
    for (const event of events) {
        if (event.duration >= 1) {
            // A sustained beat occupies its own slot; never attach dashes to the previous beat.
            for (let beat = 0; beat < event.duration; beat++) {
                groups.push([{...event, duration: 1, sustain: beat > 0}]);
                position += 4;
            }
        } else {
            if (position % 4 === 0) groups.push([]);
            groups[groups.length - 1].push(event);
            position += Math.round(event.duration * 4);
        }
    }
    return groups;
}
function validRhythm(events, beats, minDuration) {
    const ticks = events.reduce((sum, event) => sum + event.duration * 4, 0);
    return ticks === beats * 4 && events.every(event =>
        [0.25, 0.5, 1, 2].includes(event.duration) && event.duration >= minDuration
    ) && groupEvents(events).filter(group => group.some(event => event.duration === 0.25)).length <= 2;
}

// Profiles preserve equal beats while fitting two measures before reducing note size.
const notationProfiles = [
    {cell:24, accidental:12, digit:18, font:30, mark:15, noteGap:3, beatGap:18, padding:12},
    {cell:24, accidental:12, digit:18, font:30, mark:15, noteGap:2, beatGap:10, padding:8},
    {cell:20, accidental:8, digit:16, font:26, mark:13, noteGap:2, beatGap:10, padding:8},
    {cell:18, accidental:8, digit:14, font:24, mark:12, noteGap:2, beatGap:8, padding:8}
];
const accidentalInset = (event, profile = notationProfiles[0]) => event.note.accidental === 'natural' ? 0 : profile.accidental;
const noteWidth = (event, profile = notationProfiles[0]) => profile.cell + accidentalInset(event, profile);
function eventWidth(event, profile = notationProfiles[0]) {
    return event.sustain ? profile.cell : noteWidth(event, profile);
}
function beatWidth(group, profile = notationProfiles[0]) {
    return group.reduce((width, event) => width + eventWidth(event, profile), 0) + (group.length - 1) * profile.noteGap;
}
function barWidth(events, sharedBeatWidth, profile = notationProfiles[0]) {
    const groups = groupEvents(events);
    const beatMinimum = sharedBeatWidth ?? Math.max(44, ...groups.map(group => beatWidth(group, profile)));
    return profile.padding * 2 + 4 + beatMinimum * groups.length + (groups.length - 1) * profile.beatGap;
}
function createNoteElement(event) {
    if (event.sustain) {
        const dash = document.createElement('span');
        dash.className = 'duration-dash';
        dash.textContent = '－';
        return dash;
    }
    const note = event.note;
    const item = document.createElement('span');
    item.className = 'rhythm-item';
    const element = document.createElement('span');
    element.className = 'note ' + note.octave + (note.accidental !== 'natural' ? ' has-accidental' : '');
    if (note.accidental !== 'natural') {
        const accidental = document.createElement('span');
        accidental.className = 'accidental';
        accidental.textContent = note.accidental === 'sharp' ? '♯' : '♭';
        element.appendChild(accidental);
    }
    const digit = document.createElement('span');
    digit.className = 'digit';
    digit.textContent = note.number;
    element.appendChild(digit);
    item.appendChild(element);
    return item;
}
function beamSegments(events, profile = notationProfiles[0]) {
    const cells = [];
    let offset = 0;
    for (const event of events) {
        // Beam endpoints follow the 18px digit, excluding its accidental and side bearings.
        const bearing = (profile.cell - profile.digit) / 2;
        cells.push({event, left: offset + accidentalInset(event, profile) + bearing, right: offset + noteWidth(event, profile) - bearing});
        offset += eventWidth(event, profile) + profile.noteGap;
    }
    const segments = [];
    // Split each beam level into contiguous runs. A lone sixteenth keeps a short hook.
    for (const level of [1, 2]) {
        let run = [];
        const flush = () => {
            if (run.length) segments.push({level, left: run[0].left, right: run[run.length - 1].right});
            run = [];
        };
        for (const cell of cells) {
            if (cell.event.duration <= (level === 1 ? 0.5 : 0.25)) run.push(cell);
            else flush();
        }
        flush();
    }
    return segments;
}
function createBar(events, index, width = barWidth(events), profile = notationProfiles[0]) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    const variables = {'note-cell':profile.cell, 'accidental-space':profile.accidental, 'digit-width':profile.digit, 'note-font':profile.font, 'accidental-font':profile.mark, 'note-gap':profile.noteGap, 'beat-gap':profile.beatGap, 'bar-pad':profile.padding};
    Object.entries(variables).forEach(([name, value]) => bar.style.setProperty('--' + name, value + 'px'));
    bar.style.setProperty('--bar-width', width);
    bar.style.setProperty('--beats', groupEvents(events).length);
    bar.setAttribute('aria-label', '第 ' + (index + 1) + ' 小節');
    groupEvents(events).forEach(events => {
        const slot = document.createElement('span');
        slot.className = 'beat-slot';
        const group = document.createElement('span');
        group.className = 'beat-group' + (events.some(event => event.note.octave === 'low') ? ' has-low' : '');
        events.forEach(event => group.appendChild(createNoteElement(event)));
        beamSegments(events, profile).forEach(segment => {
            const beam = document.createElement('span');
            beam.className = 'rhythm-beam' + (segment.level === 2 ? ' secondary' : '');
            beam.style.left = segment.left + 'px';
            beam.style.width = (segment.right - segment.left) + 'px';
            beam.setAttribute('aria-hidden', 'true');
            group.appendChild(beam);
        });
        slot.appendChild(group);
        bar.appendChild(slot);
    });
    return bar;
}
function arrangeBars(bars, width) {
    if (!bars.length) return [];
    const candidates = notationProfiles.map(profile => {
        const sharedBeatWidth = Math.max(44, ...bars.flatMap(events => groupEvents(events).map(group => beatWidth(group, profile))));
        return {profile, minimum: Math.max(...bars.map(events => barWidth(events, sharedBeatWidth, profile)))};
    });
    // Wide stages aim for two full measures; phones prioritize a readable single measure.
    const target = width >= 900 && bars.length >= 2 ? 2 : 1;
    const {profile, minimum} = candidates.find(candidate => candidate.minimum * target <= width) || candidates.find(candidate => candidate.minimum <= width) || candidates[candidates.length - 1];
    const perLine = Math.max(1, Math.floor(width / minimum));
    const measureWidth = Math.max(minimum, width / perLine);
    const lines = [];
    bars.forEach((events, index) => {
        if (index % perLine === 0) lines.push([]);
        lines[lines.length - 1].push({events, index, width: measureWidth, profile});
    });
    return lines;
}
function renderScore(){
 const width=score.clientWidth;if(!width)return;
 const fragment=document.createDocumentFragment();
 arrangeBars(currentBars,width).forEach(bars=>{const row=document.createElement('div');row.className='score-line';const min=bars.reduce((sum,b)=>sum+b.width,0);if(min>width){row.tabIndex=0;row.setAttribute('role','region');row.setAttribute('aria-label','第 '+(bars[0].index+1)+' 小節，可左右捲動');}
 const inner=document.createElement('div');inner.className='score-line-inner';inner.style.setProperty('--line-min',min+'px');bars.forEach(bar=>inner.appendChild(createBar(bar.events,bar.index,bar.width,bar.profile)));row.appendChild(inner);fragment.appendChild(row);});
 score.replaceChildren(fragment);
}
function generateScore(){
 const selected=getSelectedNotes();updateSelection();if(!selected.length)return;
 const meter=Number(document.getElementById('meter').value),count=Number(document.getElementById('bars').value),min=Number(document.getElementById('minDuration').value);
 const nextBars = Array.from({length:count}, (_, index) =>
  generateRhythmForBar(meter, min, min === 0.25 && index === 0)
   .map(duration => ({duration, note:randomItem(selected)})));
 if (!nextBars.every(events => validRhythm(events, meter, min)) ||
     (min === 0.25 && !nextBars.some(events => events.some(event => event.duration === 0.25)))) {
  document.getElementById('error').textContent = '節奏驗證未通過，請重新出題。';
  return;
 }
 currentBars = nextBars;
 document.getElementById('scoreInfo').textContent=`${meter}/4 ・ ${count} 小節 ・ 最短 ${min===1?'四分音符':min===0.5?'八分音符':'十六分音符'} ・ ${selected.length} 個可用音`;
 renderScore();
}
noteSelector.addEventListener('change',updateSelection);
document.getElementById('naturalAll').addEventListener('click',()=>{getAllInputs().forEach(i=>i.checked=i.dataset.accidental==='natural');updateSelection();});
document.getElementById('clearAll').addEventListener('click',()=>{getAllInputs().forEach(i=>i.checked=false);updateSelection();});
document.getElementById('generate').addEventListener('click',generateScore);
let layoutFrame=0;
const observer=new ResizeObserver(()=>{cancelAnimationFrame(layoutFrame);layoutFrame=requestAnimationFrame(renderScore);});observer.observe(score);
selectOctave('middle');updateSelection();generateScore();
</script>
</body>
</html>
